name: CI

on:
  push:
  pull_request:

jobs:
  synthetic-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit and synthetic end-to-end tests
        run: >-
          python -m pytest -q tests
          --ignore=tests/test.py
          --ignore=tests/time_testing.py
          --ignore=tests/feature_testing.py
