name: fast
description: Minimal preprocessing for development smoke tests

preprocessing:
  freq_filter: true
  notch_filter: false
  bad_channels: false
  referencing: false
  asr: false
  run_ica: false
  AR: true
  fle: true
  erp: false

epoching:
  length: 4.0
  overlap: 2.0

filtering:
  l_freq: 0.5
  h_freq: 40
  notch_freq: [50, 100, 150]

bad_channels:
  flat_std: 1.0e-15
  noisy_z: 5.0
