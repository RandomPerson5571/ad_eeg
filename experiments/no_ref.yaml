name: no_ref
description: Full pipeline without re-referencing

preprocessing:
  freq_filter: true
  notch_filter: true
  bad_channels: true
  referencing: false
  asr: true
  asr_cutoff: 17
  run_ica: true
  ica_n_components: 0.95
  ica_random_state: 97
  AR: true
  fle: true
  erp: false

epoching:
  length: 4.0
  overlap: 2.0

filtering:
  l_freq: 0.5
  h_freq: 40
  notch_freq: [50, 100, 150]

bad_channels:
  flat_std: 1.0e-15
  noisy_z: 5.0
