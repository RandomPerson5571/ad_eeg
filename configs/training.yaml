test_size: 0.2
random_state: 42
cv_folds: 5
inner_cv_folds: 3
bootstrap_iterations: 1000

# Optional decision-policy settings. The standard benchmark keeps the
# historical argmax policy; scripts/run_extended_analysis.py enables these
# for the dedicated threshold/calibration experiment.
threshold_optimization: false
calibration_method: null

feature_selection:
  variance_threshold: 0.0
  correlation_threshold: 0.95
  top_k: null

xgboost:
  n_iter: 10
  cv: 3

mlp:
  hidden_layers: [128, 64]

analysis:
  threshold_optimization: true
  calibration_method: sigmoid
  permutations: 1000
  univariate_top_k: [3, 5, 8, 12]
  regularization_models:
    - logistic_regression
    - logistic_regression_l1
    - logistic_regression_elasticnet
